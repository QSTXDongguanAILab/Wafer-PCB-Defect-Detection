<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%230f766e"/><text x="16" y="21" font-size="12" font-weight="800" text-anchor="middle" fill="white" font-family="Segoe UI,sans-serif">WP</text></svg>' />
<title>PCB 与光伏硅片缺陷检测</title>
<style>
:root{
  --bg:#eaeef4; --panel:#fff; --sidebar:#f6f8fb;
  --line:#d8e0ea; --line2:#c7d2e0;
  --text:#1b2430; --muted:#5f6d7e; --title:#0f172a;
  --primary:#0f766e; --primary-hover:#115e59; --primary-soft:#e6f7f4;
  --pass:#16a34a; --pass-soft:#eafaf0;
  --review:#d97706; --review-soft:#fff7ea;
  --ng:#dc2626; --ng-soft:#fdeeee;
  --info:#1d4ed8; --info-soft:#eef4ff;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 28px rgba(15,23,42,.05);
  --radius:12px; --sidebar-w:222px; --ease:150ms ease;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--text);background:radial-gradient(1100px 380px at 0% -10%,rgba(15,118,110,.08),transparent 55%),var(--bg);line-height:1.55}
code{font-family:"Cascadia Mono",Consolas,monospace;font-size:.92em;background:#f1f5f9;padding:1px 5px;border-radius:5px}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:var(--sidebar);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.logo-mark{width:34px;height:34px;border-radius:9px;flex:none;background:linear-gradient(160deg,#0f766e,#0e7490);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.logo strong{display:block;font-size:12.5px;color:var(--title)}
.logo span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:9px;color:#4b5b6b;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background var(--ease),color var(--ease)}
.nav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:#eaf0f7;color:var(--title)}
.nav button.active{background:var(--primary-soft);color:var(--primary)}
.sidefoot{font-size:10.5px;color:var(--muted);padding:8px 6px 0;border-top:1px solid var(--line)}
main{padding:20px 24px 40px;min-width:0}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.topbar h1{margin:0;font-size:19px;color:var(--title);letter-spacing:.01em}
.topbar p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:21px;color:var(--title);font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:14.5px;color:var(--title);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{margin:16px 0 6px;font-size:12.5px;color:var(--title);text-transform:none}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.hidden{display:none!important}
.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid transparent}
.pill.ok{background:var(--pass-soft);color:var(--pass);border-color:#bbf0cd}
.pill.wip{background:var(--review-soft);color:var(--review);border-color:#f6d9a8}
.pill.todo{background:#eef1f5;color:#64748b;border-color:#d8e0ea}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:8px;background:#f1f5f9;border:1px solid var(--line);color:#334155}
.chip.ok{background:var(--pass-soft);border-color:#bbf0cd;color:#12693b;font-weight:700}
.chip.rare{background:#f8fafc;color:#94a3b8;border-style:dashed}
.chip i{font-style:normal;color:#94a3b8;margin-left:5px;font-size:10.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px}
.box.info{background:var(--info-soft);border-color:#c7d8fb;color:#1e3a8a}
.box.warn{background:var(--review-soft);border-color:#f6d9a8;color:#8a5208}
.box h4{margin:0 0 6px;font-size:12.5px;color:inherit}
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:18px 12px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer;transition:border-color var(--ease),background var(--ease)}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop img{max-width:100%;max-height:150px;image-rendering:pixelated;border-radius:6px;display:block;margin:0 auto 6px}
.drop b{color:var(--title)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{border:1px solid var(--line2);background:#fff;color:var(--title);font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer;transition:all var(--ease)}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],select{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--text)}
label.f{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{vertical-align:middle}
tbody tr:hover{background:#f8fafc}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag.pass{background:var(--pass-soft);color:var(--pass)}
.tag.review{background:var(--review-soft);color:var(--review)}
.tag.ng{background:var(--ng-soft);color:var(--ng)}
.verdict{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;border:1px solid var(--line);flex-wrap:wrap}
.verdict.pass{background:var(--pass-soft);border-color:#bbf0cd}
.verdict.review{background:var(--review-soft);border-color:#f6d9a8}
.verdict.ng{background:var(--ng-soft);border-color:#f7c7c7}
.verdict b{font-size:18px;color:var(--title)}
.verdict .kv{font-size:11.5px;color:var(--muted)}
.verdict .kv em{font-style:normal;display:block;font-size:14px;color:var(--title);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.bar{display:grid;grid-template-columns:88px 1fr 46px;align-items:center;gap:8px;font-size:11.5px}
.bar i{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bar span{height:7px;border-radius:4px;background:#e2e8f0;overflow:hidden;display:block}
.bar span u{display:block;height:100%;background:var(--primary)}
.stages{list-style:none;margin:0;padding:0;font-size:12.5px}
.stages li{padding:6px 0 6px 22px;position:relative;border-bottom:1px dashed var(--line)}
.stages li:last-child{border-bottom:0}
.stages li::before{content:"○";position:absolute;left:2px;color:#94a3b8}
.stages li.done::before{content:"●";color:var(--pass)}
.stages li.doing::before{content:"◐";color:var(--review)}
.stages li em{font-style:normal;display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.msg{font-size:12.5px;padding:9px 12px;border-radius:8px;margin-top:10px}
.msg.err{background:var(--ng-soft);color:#991b1b;border:1px solid #f7c7c7}
.msg.ok{background:var(--pass-soft);color:#12693b;border:1px solid #bbf0cd}
ul.notes{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
ul.notes li{margin-bottom:4px}
pre.json{background:#0f172a;color:#cbd5e1;padding:12px;border-radius:9px;font-size:11.5px;overflow:auto;max-height:320px;margin:0}
iframe.agent{width:100%;height:calc(100vh - 150px);border:1px solid var(--line);border-radius:var(--radius);background:#fff}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">WP</div>
      <div><strong>PCB / 光伏缺陷检测</strong><span id="verTag">Wafer-PCB-Defect-Detection</span></div>
    </div>
    <nav class="nav" id="nav">
      <button data-page="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>概览</button>
      <button data-page="pcb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h3v3H8zM13 13h3v3h-3zM11 9.5h2M9.5 11v2"/></svg>PCB 假点过滤</button>
      <button data-page="wafer"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>光伏硅片检测</button>
      <button data-page="records"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>检测记录</button>
      <button data-page="agent"><svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 0 1 4 4v1h1a3 3 0 0 1 0 6h-1v1a4 4 0 0 1-8 0v-1H7a3 3 0 0 1 0-6h1V7a4 4 0 0 1 4-4z"/></svg>缺陷处置</button>
    </nav>
    <div class="sidefoot" id="sideFoot">加载中…</div>
  </aside>

  <main>
    <div class="topbar">
      <div><h1 id="pageTitle">概览</h1><p id="pageSub">两条业务线的接入状态与数据现状</p></div>
      <div class="toolbar" style="margin:0"><button class="btn" id="btnRefresh">刷新</button></div>
    </div>
    <div class="kpis" id="kpiRow"></div>
    <div id="pages"></div>
  </main>
</div>
<script src="/static/app.js?v=001"></script>
</body>
</html>
